#:schema ./node_modules/wrangler/config-schema.json
name = "cloudflare-docs"
account_id = "121287a0c6e6260ec930655e6b39a3a8"
compatibility_date = "2025-06-02"
compatibility_flags = ["nodejs_compat"]
main = "./worker/index.ts"

workers_dev = true
route = { pattern = "cloudflare-docs.justalittlebyte.ovh/*", zone_name = "justalittlebyte.ovh" }

rules = [
	{ type = "Text", globs = ["**/__redirects"], fallthrough = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true

[[r2_buckets]]
binding = "VENDORED_MARKDOWN"
bucket_name = "vendored-markdown"

[observability]
enabled = true
